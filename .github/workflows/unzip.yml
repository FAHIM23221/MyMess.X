name: Unzip
on:
  push:
    paths: ['phase*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shopt -s nullglob
          for z in phase*.zip; do unzip -o "$z" && git rm -q "$z"; done
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Add files from zip" || exit 0
          git push
